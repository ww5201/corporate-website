<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卓翌定制 | 高端家居定制</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

<!-- ========== 轮播Banner ========== -->
<section class="pdd-banner" id="home">
  <div class="pdd-banner-track" id="bannerTrack">
    <div class="pdd-banner-slide" style="background: linear-gradient(135deg, #e74c3c 0%, #ff6b6b 50%, #ee5a24 100%);">
      <div class="pdd-banner-text">
        <h2 data-i18n="banner.s1.title">全屋定制 工厂直供</h2>
        <p data-i18n="banner.s1.desc">品质家居 · 低至3折起</p>
        <span class="pdd-banner-tag" data-i18n="banner.s1.tag">限时特惠</span>
      </div>
    </div>
    <div class="pdd-banner-slide" style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 50%, #d35400 100%);">
      <div class="pdd-banner-text">
        <h2 data-i18n="banner.s2.title">新品上市 橱柜系列</h2>
        <p data-i18n="banner.s2.desc">设计师联名 · 限量特惠</p>
        <span class="pdd-banner-tag" data-i18n="banner.s2.tag">新品首发</span>
      </div>
    </div>
    <div class="pdd-banner-slide" style="background: linear-gradient(135deg, #8e44ad 0%, #9b59b6 50%, #6c3483 100%);">
      <div class="pdd-banner-text">
        <h2 data-i18n="banner.s3.title">拼团更优惠</h2>
        <p data-i18n="banner.s3.desc">万人团购 · 价格直降到底</p>
        <span class="pdd-banner-tag" data-i18n="banner.s3.tag">万人团</span>
      </div>
    </div>
  </div>
  <div class="pdd-banner-dots" id="bannerDots">
    <span class="pdd-dot active"></span>
    <span class="pdd-dot"></span>
    <span class="pdd-dot"></span>
  </div>
</section>

<!-- ========== 分类图标 ========== -->
<section class="pdd-categories">
  <div class="pdd-cat-grid">
    <div class="pdd-cat-item" data-cat="all">
      <div class="pdd-cat-icon" style="background: #fff3e0;">🏠</div>
      <span data-i18n="cat.all">全部</span>
    </div>
    <div class="pdd-cat-item" data-cat="cabinet">
      <div class="pdd-cat-icon" style="background: #e8f5e9;">🗄️</div>
      <span data-i18n="cat.cabinet">柜类</span>
    </div>
    <div class="pdd-cat-item" data-cat="wardrobe">
      <div class="pdd-cat-icon" style="background: #e3f2fd;">👔</div>
      <span data-i18n="cat.wardrobe">衣柜</span>
    </div>
    <div class="pdd-cat-item" data-cat="kitchen">
      <div class="pdd-cat-icon" style="background: #fce4ec;">🍳</div>
      <span data-i18n="cat.kitchen">橱柜</span>
    </div>
    <div class="pdd-cat-item" data-cat="custom">
      <div class="pdd-cat-icon" style="background: #f3e5f5;">✨</div>
      <span data-i18n="cat.custom">定制</span>
    </div>
    <a href="/flash.html" class="pdd-cat-item">
      <div class="pdd-cat-icon" style="background: #ffebee;">⚡</div>
      <span data-i18n="cat.flash">秒杀</span>
    </a>
    <a href="/flash.html#group" class="pdd-cat-item">
      <div class="pdd-cat-icon" style="background: #fff8e1;">🔥</div>
      <span data-i18n="cat.group">拼团</span>
    </a>
    <a href="/chat.html" class="pdd-cat-item">
      <div class="pdd-cat-icon" style="background: #e0f7fa;">📞</div>
      <span data-i18n="cat.contact">联系</span>
    </a>
  </div>
</section>

<!-- ========== 为你推荐（商品瀑布流） ========== -->
<section class="pdd-recommend" id="products">
  <div class="pdd-section-header">
    <div class="pdd-section-title">
      <span class="pdd-rec-icon">💎</span>
      <h3 data-i18n="rec.title">为你推荐</h3>
    </div>
    <a href="/category.html" class="pdd-more">更多 ›</a>
  </div>
  <div class="pdd-product-grid" id="productsGrid">
    <!-- 动态加载商品 -->
  </div>
</section>

<script type="module" src="./src/index.js"></script>
</body>
</html>
