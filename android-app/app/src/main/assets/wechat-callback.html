<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信登录 - 卓翌定制</title>
<style>
body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 40%; background: #f5f5f7; }
.loading { color: #666; font-size: 16px; }
.spinner { width: 30px; height: 30px; border: 3px solid #ddd; border-top: 3px solid #07c160; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<div class="loading">微信登录中...</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');

  if (code) {
    // Redirect back to the main app with the code
    window.location.href = '/?wx_code=' + encodeURIComponent(code) + '&wx_state=' + encodeURIComponent(state || '');
  } else {
    var error = params.get('error') || '授权失败';
    document.querySelector('.loading').textContent = error;
    setTimeout(function() { window.location.href = '/'; }, 2000);
  }
})();
</script>
</body>
</html>
