<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 | 卓翌定制</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1677ff;
      --primary-light: #4096ff;
      --primary-bg: #e6f4ff;
      --green: #07c160;
      --green-bg: #f0fff4;
      --dark: #1a1a1a;
      --text: #333;
      --text-2: #666;
      --text-3: #999;
      --bg: #f5f5f5;
      --card: #fff;
      --border: #f0f0f0;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部 */
    .top-bar {
      background: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      width: 32px; height: 32px;
      border: none; background: transparent;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
    }
    .top-title {
      flex: 1; text-align: center;
      font-size: 16px; font-weight: 600;
      margin-right: 32px;
    }

    /* 品牌区 */
    .brand-area {
      text-align: center;
      padding: 40px 20px 30px;
    }
    .brand-logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(22,119,255,0.3);
    }
    .brand-name {
      font-size: 22px;
      font-weight: 900;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .brand-name span { color: var(--primary); }
    .brand-desc {
      font-size: 13px;
      color: var(--text-3);
    }

    /* 登录卡片 */
    .login-card {
      background: #fff;
      margin: 0 16px;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    /* Tab 切换 */
    .login-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .login-tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-3);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
      background: none;
      border: none;
    }
    .login-tab.active {
      color: var(--primary);
      font-weight: 600;
    }
    .login-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 24px; height: 3px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* Tab 内容 */
    .tab-content {
      display: none;
      padding: 24px 20px;
    }
    .tab-content.active { display: block; }

    /* ===== 手机号登录 ===== */
    .phone-login .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
    }
    .sms-btn {
      flex-shrink: 0;
      padding: 10px 16px;
      background: var(--primary-bg);
      color: var(--primary);
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .sms-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .sms-btn:not(:disabled):active {
      background: var(--primary);
      color: #fff;
    }

    input[type="tel"],
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: var(--bg);
      font-family: inherit;
    }
    input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      border: none;
      border-radius: 26px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .submit-btn:active { opacity: 0.85; }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== 微信登录 ===== */
    .wechat-login {
      text-align: center;
    }
    .qr-box {
      width: 200px; height: 200px;
      margin: 10px auto 16px;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .qr-box .qr-placeholder {
      font-size: 60px;
      margin-bottom: 8px;
    }
    .qr-box .qr-hint {
      font-size: 12px;
      color: var(--text-3);
    }
    .qr-box canvas {
      width: 180px; height: 180px;
    }
    .wechat-tip {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 16px;
    }
    .wechat-scan-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 26px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .wechat-scan-btn:active { opacity: 0.85; }

    /* 协议 */
    .agreement {
      padding: 16px 20px 0;
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
      line-height: 1.6;
    }
    .agreement a {
      color: var(--primary);
      text-decoration: none;
    }

    /* 其他登录方式 */
    .other-login {
      margin-top: 30px;
      text-align: center;
    }
    .divider-line {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      margin-bottom: 20px;
    }
    .divider-line::before,
    .divider-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider-line span {
      font-size: 12px;
      color: var(--text-3);
    }
    .social-btns {
      display: flex;
      justify-content: center;
      gap: 24px;
    }
    .social-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .social-btn:active { transform: scale(0.9); }
    .social-btn.wechat { background: #f0fff4; }
    .social-btn.phone { background: var(--primary-bg); }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ===== 已登录状态 ===== */
    .logged-in {
      display: none;
      text-align: center;
      padding: 24px 20px;
    }
    .logged-in.show { display: block; }
    .user-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      margin: 0 auto 12px;
      color: #fff;
    }
    .user-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .user-phone {
      font-size: 14px;
      color: var(--text-3);
      margin-bottom: 20px;
    }
    .user-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .user-actions button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }
    .btn-logout {
      background: var(--bg);
      color: var(--text-2);
    }
    .btn-orders {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
    }

    /* 加载 */
    .page-loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 顶部 -->
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()">&lsaquo;</button>
    <div class="top-title">登录</div>
  </div>

  <!-- 品牌区 -->
  <div class="brand-area" id="brandArea">
    <div class="brand-logo">🏠</div>
    <div class="brand-name">卓翌<span>定制</span></div>
    <div class="brand-desc">高端家居定制 · 品质生活</div>
  </div>

  <!-- 登录卡片 -->
  <div class="login-card" id="loginCard">
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchTab('phone')">📱 手机登录</button>
      <button class="login-tab" onclick="switchTab('wechat')">💚 微信登录</button>
    </div>

    <!-- 手机号登录 -->
    <div class="tab-content active" id="tab-phone">
      <div class="phone-login">
        <div class="input-group">
          <label>手机号码</label>
          <input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="input-group">
          <label>验证码</label>
          <div class="input-row">
            <input type="text" id="codeInput" placeholder="6位验证码" maxlength="6">
            <button class="sms-btn" id="smsBtn" onclick="sendSms()">获取验证码</button>
          </div>
        </div>
        <button class="submit-btn" id="phoneLoginBtn" onclick="phoneLogin()">登录 / 注册</button>
      </div>
    </div>

    <!-- 微信登录 -->
    <div class="tab-content" id="tab-wechat">
      <div class="wechat-login">
        <div class="qr-box" id="qrBox">
          <div class="qr-placeholder">💬</div>
          <div class="qr-hint">点击下方按钮登录</div>
        </div>
        <div class="wechat-tip">请使用微信扫一扫登录</div>
        <button class="wechat-scan-btn" onclick="wechatLogin()">
          💚 微信一键登录
        </button>
      </div>
    </div>

    <!-- 协议 -->
    <div class="agreement">
      登录即代表同意 <a href="javascript:void(0)">《用户协议》</a> 和 <a href="javascript:void(0)">《隐私政策》</a>
    </div>
  </div>

  <!-- 已登录状态 -->
  <div class="login-card" id="loggedInCard" style="margin:0 16px;display:none">
    <div class="logged-in show">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-name" id="userName">用户</div>
      <div class="user-phone" id="userPhone"></div>
      <div class="user-actions">
        <a href="/payment.html" style="text-decoration:none"><button class="btn-orders">💳 我的订单</button></a>
        <button class="btn-logout" onclick="doLogout()">退出登录</button>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div style="margin-top:auto">
    <div style="height:70px"></div>
    <div style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0f0f0;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)">
      <a style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;text-decoration:none;cursor:pointer" href="/">
        <span style="font-size:22px;margin-bottom:2px">🏠</span>
        <span style="font-size:10px;color:#999">首页</span>
      </a>
      <a style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;text-decoration:none;cursor:pointer" href="/shop.html">
        <span style="font-size:22px;margin-bottom:2px">🛍️</span>
        <span style="font-size:10px;color:#999">商品</span>
      </a>
      <a style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;text-decoration:none;cursor:pointer" href="/payment.html">
        <span style="font-size:22px;margin-bottom:2px">💳</span>
        <span style="font-size:10px;color:#999">支付</span>
      </a>
      <a style="flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0 8px;text-decoration:none;cursor:pointer" href="/login.html">
        <span style="font-size:22px;margin-bottom:2px">👤</span>
        <span style="font-size:10px;color:#1677ff;font-weight:600">我的</span>
      </a>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>
const API = '';
let smsCountdown = 0;
let smsTimer = null;

// ===== Tab 切换 =====
function switchTab(tab) {
  document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.login-tab:nth-child(${tab === 'phone' ? 1 : 2})`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

// ===== 发送验证码 =====
async function sendSms() {
  const phone = document.getElementById('phoneInput').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) {
    return showToast('请输入正确的手机号');
  }

  const btn = document.getElementById('smsBtn');
  btn.disabled = true;

  try {
    const res = await fetch(API + '/api/auth/sms/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();

    if (data.success) {
      showToast('验证码已发送');
      // 开发模式：自动填入验证码
      if (data._debugCode) {
        document.getElementById('codeInput').value = data._debugCode;
      }
      // 倒计时
      smsCountdown = 60;
      smsTimer = setInterval(() => {
        smsCountdown--;
        btn.textContent = `${smsCountdown}s`;
        if (smsCountdown <= 0) {
          clearInterval(smsTimer);
          btn.textContent = '获取验证码';
          btn.disabled = false;
        }
      }, 1000);
    } else {
      showToast(data.error || '发送失败');
      btn.disabled = false;
    }
  } catch (e) {
    showToast('网络错误');
    btn.disabled = false;
  }
}

// ===== 手机号登录 =====
async function phoneLogin() {
  const phone = document.getElementById('phoneInput').value.trim();
  const code = document.getElementById('codeInput').value.trim();

  if (!/^1[3-9]\d{9}$/.test(phone)) {
    return showToast('请输入正确的手机号');
  }
  if (!/^\d{6}$/.test(code)) {
    return showToast('请输入6位验证码');
  }

  const btn = document.getElementById('phoneLoginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';

  try {
    const res = await fetch(API + '/api/auth/phone/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, code }),
    });
    const data = await res.json();

    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showToast(data.user.isNew ? '注册成功！' : '登录成功！');
      setTimeout(() => showLoggedIn(data.user), 500);
    } else {
      showToast(data.error || '登录失败');
      btn.disabled = false;
      btn.textContent = '登录 / 注册';
    }
  } catch (e) {
    showToast('网络错误');
    btn.disabled = false;
    btn.textContent = '登录 / 注册';
  }
}

// ===== 微信登录 =====
async function wechatLogin() {
  showToast('正在连接微信...');
  try {
    const res = await fetch(API + '/api/auth/wechat/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: 'mock_wechat_code_' + Date.now() }),
    });
    const data = await res.json();

    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showToast(data.user.isNew ? '微信注册成功！' : '微信登录成功！');
      setTimeout(() => showLoggedIn(data.user), 500);
    } else {
      showToast(data.error || '登录失败');
    }
  } catch (e) {
    showToast('网络错误');
  }
}

// ===== 显示已登录 =====
function showLoggedIn(user) {
  document.getElementById('brandArea').style.display = 'none';
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('loggedInCard').style.display = 'block';
  document.getElementById('userName').textContent = user.nickname || '用户';
  document.getElementById('userPhone').textContent = user.phone ? user.phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2') : '未绑定手机';
  document.getElementById('userAvatar').textContent = user.nickname ? user.nickname[0] : '👤';
  document.querySelector('.top-title').textContent = '我的';
}

// ===== 退出登录 =====
async function doLogout() {
  const token = localStorage.getItem('token');
  try {
    await fetch(API + '/api/auth/logout', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
    });
  } catch (e) {}

  localStorage.removeItem('token');
  localStorage.removeItem('user');
  showToast('已退出登录');
  setTimeout(() => location.reload(), 500);
}

// ===== 返回 =====
function goBack() {
  if (document.referrer && document.referrer !== location.href) {
    history.back();
  } else {
    location.href = '/';
  }
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 初始化：检查是否已登录 =====
async function checkLogin() {
  const token = localStorage.getItem('token');
  const savedUser = localStorage.getItem('user');

  if (token && savedUser) {
    try {
      const res = await fetch(API + '/api/auth/me', {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (res.ok) {
        const data = await res.json();
        if (data.success) {
          showLoggedIn(data.user);
          localStorage.setItem('user', JSON.stringify(data.user));
          return;
        }
      }
    } catch (e) {}
    // Token 过期
    localStorage.removeItem('token');
    localStorage.removeItem('user');
  }
}

checkLogin();
</script>
</body>
</html>
